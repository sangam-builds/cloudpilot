services:
  # Relational Database (Local fallback if cloud DB is not configured)
  postgres:
    image: postgres:16-alpine
    container_name: cloudpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: cloudpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Python AI NLP & Vector Triage Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cloudpilot-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_PORT=8000
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Spring Boot Core Orchestration Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpilot-backend
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=${CLOUD_DB_URL:-jdbc:postgresql://postgres:5432/cloudpilot}
      - SPRING_DATASOURCE_USERNAME=${CLOUD_DB_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${CLOUD_DB_PASSWORD:-password}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - CLOUDPILOT_AI_SERVICE_BASE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Prometheus Telemetry & Metrics Scraper
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: cloudpilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  # Grafana Real-Time Observability Visualizer
  grafana:
    image: grafana/grafana:11.1.0
    container_name: cloudpilot-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
