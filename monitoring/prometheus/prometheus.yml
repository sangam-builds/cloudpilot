global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot Backend Actuator Micrometer Metrics
  - job_name: 'cloudpilot-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['backend:8080']

  # Python FastAPI AI Service
  - job_name: 'cloudpilot-ai-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['ai-service:8000']

  # Self Scrape
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
