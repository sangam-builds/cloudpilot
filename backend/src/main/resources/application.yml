server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: cloudpilot-backend

  datasource:
    url: ${CLOUD_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cloudpilot}}
    username: ${CLOUD_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${CLOUD_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000
      keepalive-time: 15000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

cloudpilot:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration-ms: 86400000 # 24 hours
      refresh-expiration-ms: 604800000 # 7 days
  ai-service:
    base-url: ${CLOUDPILOT_AI_SERVICE_BASE_URL:${AI_SERVICE_URL:http://localhost:8000}}
    timeout-ms: 5000
  sla:
    scan-rate-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  health:
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.cloudpilot: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
