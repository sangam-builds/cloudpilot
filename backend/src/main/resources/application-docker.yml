spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${CLOUD_DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cloudpilot}}
    username: ${CLOUD_DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${CLOUD_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 20000
      keepalive-time: 15000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

cloudpilot:
  ai-service:
    base-url: ${CLOUDPILOT_AI_SERVICE_BASE_URL:${AI_SERVICE_URL:http://ai-service:8000}}

management:
  health:
    redis:
      enabled: false
